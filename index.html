<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cofrinho do Trevisol</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<div class="container">

    <h1>💰 Cofrinho do Trevisol</h1>

    <div id="usuario"></div>

    <div class="card">

        <input
            id="valor"
            type="number"
            placeholder="Valor recebido"
        >

        <input
            id="percentual"
            type="number"
            value="40"
            placeholder="% para guardar"
        >

        <button onclick="salvar()">
            Salvar Depósito
        </button>

    </div>

    <div class="saldo">

        <h2>Total Guardado</h2>

        <h1 id="total">
            R$ 0,00
        </h1>

    </div>

    <table>

        <thead>

            <tr>
                <th>Valor</th>
                <th>%</th>
                <th>Guardado</th>
                <th>Ação</th>
            </tr>

        </thead>

        <tbody id="historico"></tbody>

    </table>

</div>

<script type="module" src="app.js"></script>

</body>
</html>
